name: AI Knowledge Collector

on:
  schedule:
    # Mỗi 15 phút
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ==========================================================
  # 5 WORKERS CHẠY SONG SONG
  # ==========================================================

  collect:

    name: Collector ${{ matrix.worker }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      max-parallel: 5

      matrix:
        worker:
          - 0
          - 1
          - 2
          - 3
          - 4

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Mistral SDK
        run: |
          python -c "from mistralai.client import Mistral; print('Mistral SDK OK')"

      - name: Run collector
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-large-latest

          WORKER_ID: ${{ matrix.worker }}
          TOTAL_WORKERS: "5"

          MAX_ARTICLES: "10"

        run: |
          python collector/collector.py

      - name: Upload worker data
        uses: actions/upload-artifact@v4
        with:
          name: collector-results-${{ matrix.worker }}
          path: collector_output/
          if-no-files-found: ignore
          retention-days: 1


  # ==========================================================
  # MERGE DUY NHẤT
  # ==========================================================

  merge:

    name: Merge database

    needs: collect

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download worker results
        uses: actions/download-artifact@v4
        with:
          pattern: collector-results-*
          path: worker_results
          merge-multiple: true

      - name: Merge and remove duplicates
        run: |
          python - <<'PY'
          import json
          import hashlib
          import re
          from pathlib import Path

          database = Path("database")
          results = Path("worker_results")

          database.mkdir(
              parents=True,
              exist_ok=True
          )

          seen_ids = set()
          seen_urls = set()
          seen_titles = set()
          seen_content = set()

          def normalize_url(url):
              return url.strip().lower().rstrip("/")

          def normalize_title(title):
              title = title.lower()
              title = re.sub(
                  r"[^\w\s]",
                  " ",
                  title,
                  flags=re.UNICODE
              )
              title = re.sub(
                  r"\s+",
                  " ",
                  title
              )
              return title.strip()

          # ==========================================
          # ĐỌC DATABASE CŨ
          # ==========================================

          for file in database.rglob("*.jsonl"):

              try:

                  lines = file.read_text(
                      encoding="utf-8"
                  ).splitlines()

              except Exception:
                  continue

              for line in lines:

                  try:
                      item = json.loads(line)
                  except Exception:
                      continue

                  if item.get("id"):
                      seen_ids.add(
                          item["id"]
                      )

                  if item.get("url"):
                      seen_urls.add(
                          normalize_url(
                              item["url"]
                          )
                      )

                  if item.get("title"):
                      seen_titles.add(
                          normalize_title(
                              item["title"]
                          )
                      )

                  if item.get("content_hash"):
                      seen_content.add(
                          item["content_hash"]
                      )

          # ==========================================
          # ĐỌC KẾT QUẢ 5 WORKER
          # ==========================================

          added = 0
          duplicate = 0

          for file in results.rglob(
              "*.jsonl"
          ):

              for line in file.read_text(
                  encoding="utf-8"
              ).splitlines():

                  try:
                      item = json.loads(line)
                  except Exception:
                      continue

                  item_id = item.get(
                      "id"
                  )

                  url = normalize_url(
                      item.get(
                          "url",
                          ""
                      )
                  )

                  title = normalize_title(
                      item.get(
                          "title",
                          ""
                      )
                  )

                  content_hash = item.get(
                      "content_hash",
                      ""
                  )

                  # ==================================
                  # CHỐNG TRÙNG
                  # ==================================

                  if item_id in seen_ids:
                      duplicate += 1
                      continue

                  if url in seen_urls:
                      duplicate += 1
                      continue

                  if title in seen_titles:
                      duplicate += 1
                      continue

                  if (
                      content_hash
                      and
                      content_hash in seen_content
                  ):
                      duplicate += 1
                      continue

                  category = item.get(
                      "category",
                      "Technology"
                  )

                  category_dir = (
                      database /
                      category
                  )

                  category_dir.mkdir(
                      parents=True,
                      exist_ok=True
                  )

                  from datetime import datetime, timezone

                  date = datetime.now(
                      timezone.utc
                  ).strftime(
                      "%Y-%m-%d"
                  )

                  output = (
                      category_dir /
                      f"{date}.jsonl"
                  )

                  with open(
                      output,
                      "a",
                      encoding="utf-8"
                  ) as f:

                      f.write(
                          json.dumps(
                              item,
                              ensure_ascii=False
                          )
                          + "\n"
                      )

                  seen_ids.add(item_id)
                  seen_urls.add(url)
                  seen_titles.add(title)

                  if content_hash:
                      seen_content.add(
                          content_hash
                      )

                  added += 1

          print(
              f"Added: {added}"
          )

          print(
              f"Duplicates removed: {duplicate}"
          )

          PY

      - name: Commit database
        run: |

          git config user.name \
            "AI Knowledge Collector"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add database/

          if git diff --cached --quiet; then

            echo "No new data."

          else

            git commit \
              -m "data: update knowledge base"

            git push

          fi
